version: "3.9"

# ═══════════════════════════════════════════════
# HRIS Multi-Merchant — Phase 1: Auth & Tenant
# ═══════════════════════════════════════════════

services:

  # ── Traefik (API Gateway) ──────────────────
  traefik:
    image: traefik:v3.1
    container_name: hris-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hris-net
    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.traefik.rule=Host(`traefik.hris.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # ── Go Backend API ────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hris-api
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - APP_PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=hris
      - DB_PASSWORD=hris_secret
      - DB_NAME=hris_db
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=change-me-in-production-use-256-bit-key
      - JWT_EXPIRY_MINUTES=15
      - JWT_REFRESH_DAYS=7
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hris-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.hris.local`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  # ── Next.js Frontend (PWA) ────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hris-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api.hris.local
      - NODE_ENV=development
    expose:
      - "3001"
    depends_on:
      - api
    networks:
      - hris-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.hris.local`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3001"

  # ── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hris
      - POSTGRES_PASSWORD=hris_secret
      - POSTGRES_DB=hris_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hris-net

  # ── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hris-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hris-net

  # ── RabbitMQ ───────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hris-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hris-net

  # ── Prometheus ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: hris-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - hris-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.hris.local`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # ── Grafana ────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: hris-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - hris-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.hris.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  promdata:
  grafanadata:

networks:
  hris-net:
    driver: bridge
